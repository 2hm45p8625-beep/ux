<title>讲课故事地图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one winding road across a campus scene; a student character walks station to station; a card under the road holds the teaching notes for the current stop. */
:root{
  --bg:#FFF9EE; --card:#FFFFFF; --line:#E6DCC6; --ink:#3F3B35; --muted:#7C766B;
  --teal:#1F7A74; --teal-soft:#DCEEEA; --orange:#D9692B; --orange-soft:#FBE5D6;
  --sky:#DDEFEF; --hill1:#BFDDD2; --hill2:#A5CDBF; --road:#D8CBB0; --tree:#5E9B87;
  --font:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B2321; --card:#243230; --line:#37504B; --ink:#EAE6DC; --muted:#A7B3AE;
  --teal:#5CC2B8; --teal-soft:#2A4A47; --orange:#F0935A; --orange-soft:#4A3426;
  --sky:#27413E; --hill1:#2F514A; --hill2:#3A6158; --road:#55645F; --tree:#7BB7A4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B2321; --card:#243230; --line:#37504B; --ink:#EAE6DC; --muted:#A7B3AE;
  --teal:#5CC2B8; --teal-soft:#2A4A47; --orange:#F0935A; --orange-soft:#4A3426;
  --sky:#27413E; --hill1:#2F514A; --hill2:#3A6158; --road:#55645F; --tree:#7BB7A4; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;font-size:15px;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:26px;color:var(--teal);text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;border:2px solid var(--teal);background:transparent;color:var(--teal);border-radius:999px;padding:7px 18px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--teal);color:#fff}
.tab:focus-visible,.btn:focus-visible,.row:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.stage{background:var(--sky);border-radius:20px;overflow:hidden;border:1px solid var(--line);position:relative}
.stage svg{display:block;width:100%;height:auto}
.lbl{font-size:21px;fill:var(--ink);text-anchor:middle;font-weight:700}
.lbl.dim{fill:var(--muted);font-weight:400}
.node{cursor:pointer}
.node circle.base{fill:var(--card);stroke:var(--teal);stroke-width:4}
.node.done circle.base{fill:var(--teal)}
.node.done text.num{fill:#fff}
.node.cur circle.base{fill:var(--orange);stroke:var(--orange)}
.node.cur text.num{fill:#fff}
.node text.num{font-size:24px;font-weight:700;fill:var(--teal);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ring{fill:none;stroke:var(--orange);stroke-width:3;opacity:.0}
.node.cur .ring{opacity:.7;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{r:30;opacity:.8}100%{r:52;opacity:0}}
.hero{transform-box:fill-box}
.bob{animation:bob .5s ease-in-out infinite alternate}
.still .bob{animation:none}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.bubble{margin:0 14px 14px;background:var(--card);border:2px solid var(--orange);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.6;box-shadow:0 2px 0 var(--orange);min-height:3.4em}
.bubble b{color:var(--orange)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;background:var(--teal);color:#fff}
.btn.alt{background:var(--card);color:var(--teal);border:2px solid var(--teal)}
.btn.play[aria-pressed="true"]{background:var(--orange)}
.prog{flex:1;min-width:140px;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--orange);transition:width .5s}
.meta{color:var(--muted);font-size:13px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:22px;color:var(--teal);text-wrap:balance}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.tag.o{background:var(--orange-soft);color:var(--orange)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col{background:var(--bg);border-radius:14px;padding:12px 14px;min-width:0}
.col h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;color:var(--orange)}
.col ul{margin:0;padding-left:18px}
.col li{margin:2px 0}
.col p{margin:0}
.over{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 8px}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer}
.row:hover{background:var(--teal-soft)}
.row[aria-current="true"]{background:var(--orange-soft)}
.row .n{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.row[aria-current="true"] .n{background:var(--orange)}
.row .t{min-width:0}
.row .t small{display:block;color:var(--muted)}
.row .m{color:var(--muted);font-size:13px;white-space:nowrap}
.foot{color:var(--muted);font-size:13px}
@media (max-width:620px){.lbl{display:none}.bubble{font-size:14px}h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){.bob,.node.cur .ring{animation:none}}
</style>

<div class="wrap">
  <div>
    <h1>讲课故事地图</h1>
    <p class="sub">一个角色，一条路，一站一站走完一节课。跟着故事走一遍，流程就记住了。</p>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="stage still" id="stage">
    <svg id="svg" viewBox="0 0 1000 300" role="img" aria-label="校园小路，学生沿着小路一站一站走"></svg>
    <div class="bubble" id="bubble"></div>
  </div>
  <div class="ctrl">
    <button class="btn alt" id="prev" type="button">上一站</button>
    <button class="btn" id="next" type="button">下一站</button>
    <button class="btn alt play" id="play" type="button" aria-pressed="false">自动讲故事</button>
    <div class="prog" aria-hidden="true"><i id="pbar"></i></div>
    <span class="meta" id="pmeta"></span>
  </div>
  <div class="card" id="card"></div>
  <div class="over" id="over" aria-label="全程总览"></div>
  <p class="foot" id="foot"></p>
</div>

 {t:'动手：做出“我的竞品分析”',pg:'第29–32页',m:27.5,
  story:'小夏回到自己的拼单App：让AI做五要素和SWOT，加上竞品截图，核对一遍，写下一句差异点，存成一页。',
  say:['第29页：今天要做出一页“我的竞品分析”，五条完成标准，学生自己对（1.5分钟）。','第30页：先看做完的样子（1分钟）。','第31页：第2步，复制五要素提示词发给AI，把回答整段粘回页面，自动拆进五层和SWOT（15分钟）。','第32页：第3步，看页面提醒，打开竞品App核对一处并截图，写一句差异点，复制全文或保存成图片，保存好，作为平时作业的一部分（10分钟）。','格式不对、页面打不开：用第33、34页备用提示词和《第六章备用互动单》。'],
  doing:'这是今天要做出的东西：“我的竞品分析”，保存好，作为平时作业的一部分，不用上传对分易。',next:'存好了。最后一页收个尾。'},
 {t:'到站：谢谢',pg:'第35页',m:0.5,
  story:'小夏把做好的一页存进了平时作业。之后做原型，他就从这张对比里“和竞品不一样”的那一层开始改。',
  say:['最后一页：今天做的“我的竞品分析”，保存好，作为平时作业的一部分，不用上传。'],
  doing:'保存好，下课。',next:'下课。'}
 ]},
ch7a:{tab:'第七章（一）原型 理论',hero:'小夏',title:'小夏看懂界面：为什么先画一张纸，再做原型',
 foot:'时间来自课件备注，合计 81 分钟：五原则约 26 分钟，文字与图标约 19 分钟，原型种类约 21 分钟。页码按理论课课件（共33页）。',
 st:[
 {t:'出发：先画一张纸',pg:'第1–3页',m:5.5,
  story:'小夏的拼单App马上要开发了。老师问他：是直接开工，还是先在纸上画一张？画一张纸只要一分钟，做出来再改常常要几个星期。',
  say:['第2页：先问学生，直接开工还是先画纸？心里想，不点名。','第2页：原型就是能拿来试、拿来改的样子。','第3页：整个原型设计分理论和实践两个部分；今天是理论部分，实践部分带电脑，用Axure画自己的产品。'],
  doing:'心里想一想，不用说，不用交。',next:'先画纸，那就得先看懂界面。下一站：用户为什么会卡住。'},
 {t:'两道沟：用户为什么会卡住',pg:'第4页',m:3.5,
  story:'小夏发现，用户不是笨，是卡在两道沟前：不知道点哪里，点了又看不懂发生了什么。',
  say:['执行鸿沟：想做一件事，却不知道该点哪里、怎么做。','评估鸿沟：点了以后，看不懂系统现在是什么状态。','设计师的主要工作，就是帮用户跨过这两道沟。'],
  doing:'听，不用答。',next:'怎么跨过去？下一站：五把尺子。'},
 {t:'五把尺子：五原则',pg:'第5–13页',m:22.5,
  story:'老师递给小夏五把尺子：简单、可见、可记忆、可预测、安全。每一把都是一个问题，可以拿去问任何界面。',
  say:['第5页：五条原则总览，每条对应一个问题。','第6页简单性：奥卡姆剃刀、80/20、渐进披露。','第7页可见性：认出来比想起来容易，及时反馈。','第8–9页可记忆性：位置固定、逻辑分组、保持一致、用常规。','第10–11页可预测性：F型视线、熟悉的东西猜得到。','第12页安全性：能撤销，把出错之后也设计进去。','第13页：一句话记住五条。'],
  doing:'跟着看，心里对照自己用过的App。',next:'尺子认全了，下一站：用它们量一次真实的操作。'},
 {t:'练一练：给“删除动态”打分',pg:'第14页',m:3.5,
  story:'小夏看着四张图：看到动态、点三个点、点删除、删除之后。他拿五把尺子一条条量。',
  say:['第14页：四张图依次是看到动态、点右上角、点删除确认、删除之后。','让学生心里给五条各打分：好、一般、差。','不点名，不要求说。同一个操作可能同时体现好几条。'],
  doing:'心里给五条各打个分。',next:'五条原则量完了。下一站：字和图标。'},
 {t:'字和图标：字体、图标',pg:'第15–21页',m:19,
  story:'小夏发现，同一段话换个排法就更好读；同一个图标，旁边加几个字就不会被认错。',
  say:['第15页：衬线和无衬线，各适合什么。','第16页：同一段话两种排法，心里读一读哪边更费劲。','第17页：研究结果并不一致，别背结论，看用户和任务。','第18–20页：图标五条原则、颜色先于形状、对比和数量。','第21页小测：三个情境，哪些地方要加文字。'],
  doing:'看、心里想，不点名。',next:'字和图标都有了。下一站：原型有哪几种。'},
 {t:'原型：有什么用，低保真高保真',pg:'第22–23页',m:6,
  story:'小夏明白了：原型省钱省时、好沟通、能验证需求；先粗后细，先用低保真定方向。',
  say:['第22页：省钱省时、好沟通、验证需求。','第23页：低保真先验证结构和路径；高保真再检查细节；相似度越高不一定越好。'],
  doing:'听。',next:'低保真具体长什么样？下一站。'},
 {t:'低保真：长什么样',pg:'第24–27页',m:10,
  story:'小夏翻出了草图、故事板、页面关系图、索引卡、便利贴、纸面原型；还有“绿野仙踪”：幕后有人（现在也可以是AI）在回应。',
  say:['第24页：草图、故事板、页面关系图。','第25页：索引卡、便利贴、纸面原型。','第26页：绿野仙踪，以前是真人躲幕后，现在可以让AI扮演。','第27页：低保真快、敢提意见、反馈多。'],
  doing:'看，不用答。',next:'低保真有了，高保真呢？下一站。'},
 {t:'选型：高保真，先定问题再选',pg:'第28–29页',m:5,
  story:'小夏看到高保真：像真的，成本也高。老师提醒他：先定问题，再选原型。',
  say:['第28页：高保真看起来像真的，通常用专业工具，比如Axure。','第29页：页面怎么走→草图；文案反馈对不对→更像真的；功能没做出来→绿野仙踪。','原型帮助讨论和测试设计，用户需求本身仍要靠真实调研验证。'],
  doing:'听。',next:'下一站：收尾。'},
 {t:'到站：实践部分带电脑',pg:'第30–33页',m:6,
  story:'小夏把今天走的路回顾了一遍。接下来的实践部分，他要带电脑，用Axure画自己的拼单App。',
  say:['第30页：小结。','第31页：实践部分带电脑和电源，装好Axure；找出旅程图最低的一段和竞品里“不一样的一点”；想好一条主要操作。不用提前画。','第32页：课后小事，下次打开App，想想它用了哪条原则。不用交。'],
  doing:'课后小事，不用交。',next:'下课。'}
 ]},
ch7b:{tab:'第七章（二）原型 实践',hero:'小夏',title:'小夏画自己的拼单App：Axure手搭，AI给清单，AI直接出',
 foot:'时间来自课件备注，合计约 192 分钟，一次 90 分钟的课放不下。按内容分三段：Axure 手搭（第1–17页）约 69 分钟；AI 摆放清单照着搭（第18–26页）约 56 分钟；AI 检查和 AI 直接出（第27–41页）约 67 分钟。可拆成两次课，或把最后一段改成课后选做。页码按实践课课件（共42页，第40页是备用提示词，第41页是备用页：没装好Axure时用PowerPoint做）。',
 st:[
 {t:'出发：今天画自己的产品',pg:'第1–4页',m:11,
  story:'小夏带着电脑走进教室。今天他不听，要画。老师先摆出做原型的几种办法，再让他在纸上把三行字和页面清单写下来。',
  say:['第2页：今天先Axure，再让AI帮你搭，最后体验让AI直接出原型。','第3页：做原型有八种办法，没有最好，只有适合你的。','第4页：5分钟写三行字（产品、主要操作、页面清单）。例子：校园拼单。','各做各的，有问题举手；成果保存好，作为平时作业的一部分，不上传。'],
  doing:'在纸上写三行字和页面清单。',next:'想清楚了。下一站：认识Axure。'},
 {t:'认识Axure：界面、建页面、保存',pg:'第5–7页',m:13,
  story:'小夏打开Axure，先认了五个位置，建好四个页面，再把文件存好。',
  say:['第5页：元件库、画布、样式、页面列表、预览；强调右边“样式”能直接输入数字。Axure没装好的同学，翻第41页备用页，用PowerPoint做。','第6页：按清单建页面，画布选手机尺寸。','第7页：文件名、专门文件夹、每步保存、存第二份。','菜单名随版本略有不同，老师演示一次。'],
  doing:'跟着老师找位置、建页面、先保存。',next:'页面建好了，下一站：往页面里摆东西。'},
 {t:'摆元件：元件和文字',pg:'第8–11页',m:19,
  story:'小夏拖出矩形和按钮，把位置和大小直接输入成数字；再改文字，让同类东西保持一个样子。',
  say:['第8页：摆第一个东西，输入X、Y、宽、高。','第9页：常用的六个元件。','第10页：按钮用动词加对象；图标认不出就加字。','第11页：双击改文字，样式里改字号颜色，用对齐工具。'],
  doing:'先做首页，摆几个元件。',next:'一页页做太累。下一站：母版和连起来。'},
 {t:'连起来：母版和链接',pg:'第12–14页',m:15,
  story:'小夏把标题栏做成母版，每页拖进去；再给按钮连上链接，连一个测一个。',
  say:['第12页：母版，做一次每页都用。找不到就复制页面。','第13页：选中按钮→点击时→打开链接→选页面，先连主要的那条路。','第14页：常见错误：没跳、点到别的、回不去、跳错页。'],
  doing:'连出一条路，边连边点。',next:'连好了，走一遍。下一站：预览和自查。'},
 {t:'自查：预览、导出、检查',pg:'第15–17页',m:11,
  story:'小夏点了预览，当自己是第一次用的人走一遍；再把文件、网页、截图三样都存好，对着七条自查一遍。',
  say:['第15页：当第一次用的人，从首页点到最后。','第16页：预览、发布成网页、截图，三样都存。','第17页：七条自查。'],
  doing:'走一遍，打钩。不用说。',next:'手搭的基本功过关了。下一站：让AI帮你搭。'},
 {t:'AI清单：规矩和摆放清单',pg:'第18–23页',m:22,
  story:'小夏知道了用AI的三条规矩：不发隐私、AI会错要核对、留下过程。然后让AI逐页写出每个元件的类型、文字、位置和大小。',
  say:['第18页：三条规矩。','第19页：AI想布局，你来搭，搭出来的是真原型。','第20页：写原型说明书，五样东西。','第21页：一行就是一个元件，读懂X、Y、宽、高。','第22页：学生扫码打开“原型小助手”，展开B块，填产品信息，复制提示词发给AI。','第23页：把AI的清单粘进B块，点“预览清单”，看有没有红框。','不点名、不要求口头回答；先别关页面。','打不开：用对分易里的html文件，电脑双击。'],
  doing:'填信息，让AI出清单，预览检查。',next:'清单有了。下一站：照着搭。'},
 {t:'搭三关：示范、动手、卡点',pg:'第24–26页',m:34,
  story:'老师先示范第一页的三个小成功，小夏照着清单一行一行搭，每搭一行打一个✓。三关过完，他的拼单App能从首页点到完成。',
  say:['第24页：拖出元件、输入数字、改文字打✓。','第25页：第一关搭首页，第二关搭第二页并连起来，第三关走一遍找一处想改的。约25分钟。','第26页：找不到样式、数字没变、被盖住、点了不跳，四个卡点。','老师巡视；不点名、不展示。'],
  doing:'照清单搭，打✓，过三关。',next:'搭出来了，下一站：让AI帮你检查。'},
 {t:'AI检查：改文字、五原则、新用户',pg:'第27–29页',m:19,
  story:'小夏让AI给按钮想三个说法，按五原则检查自己的原型，还让AI扮演第一次用的人，说说哪里会卡住。',
  say:['第27页：C块，改一个不清楚的文字。','第28页：F块，把页面和步骤写给AI，挑一条有用的去改，再找一条没根据的。','第29页：E块，AI当第一次用的人，再请一位真同学点一遍，不讲解。','AI只是练习用的模拟用户，不能代替真人。'],
  doing:'改文字，查五原则，听AI当新用户。',next:'还有一种更快的：让AI直接出。下一站。'},
 {t:'AI直接出：三条路',pg:'第30–36页',m:29,
  story:'小夏尝试了让AI直接写网页，也试了让AI画界面图，再把图放进Axure加上点击。三条路他都走了一遍，终于明白各有长处。',
  say:['第30页：三条路对比：网页代码、画界面图、图放进Axure。','第31–33页路一：发给AI、粘贴预览、追着改，一次只改一件。','第34页路二：G块拼画图提示词，图里文字常出错，后面自己加。','第35页路三：图拖进Axure，画透明矩形，点击时打开链接。','第36页：怎么选，按自己的情况。'],
  doing:'看示范，自己选一条先试。',next:'选好了，下一站：动手做。'},
 {t:'选一路：做出产品图',pg:'第37页',m:12,
  story:'小夏选了路一，让AI写出网页，点着走了一遍；还把一页图拖进了Axure，加上点击。',
  say:['第37页：路一D块，或路二G块，做得快的做路三。','保存html或图片，再加一张截图。','做得快的，可以多加一个页面。'],
  doing:'选一条路，做出产品图。',next:'做完了，下一站：改一改，存好。'},
 {t:'到站：存好，收尾',pg:'第38–41页',m:7.5,
  story:'小夏把Axure文件、一张截图、一条采纳的建议放进一个文件夹，保存好。',
  say:['第38页：Axure文件、一张截图、一条采纳的建议，放一个文件夹。','第39页：小结，从想法到能点的原型。','保存好，作为平时作业的一部分，不用上传。'],
  doing:'保存，下课。',next:'下课。'}
 ]},
ch4:{tab:'第四章　场景分析',hero:'小李',title:'小李的校园：学会写一个麻烦',
 foot:'时间来自课件备注，合计约89分钟。页码按最新版课件（第四章共38页；第20–24页场景盲盒、第34–37页STAR为选做或选学，不占课堂时间）。',
 st:[
 {t:'出发：这次学什么',pg:'第3页',m:3,
  story:'小李是大一新生，想找人一起吃饭，却不好意思在班群里开口。他是这一章的主角。老师先说：这次课结束，你们要做到三件事——看懂场景、写出场景、讲成小故事。',
  say:['画像回答“他是谁”，场景回答“卡在哪一步”。','三件事：看懂、写出、讲出。','新名词都是工具，不用背。'],
  doing:'心里有个数，不用答。',next:'先学看懂：什么算场景。'},
 {t:'看懂：什么是场景',pg:'第4–5页',m:6.5,
  story:'老师给小李看两句话：一句是“小李希望界面更好看”，一句是“周三中午12点，小李在教学楼下，想约人吃饭，却不好意思在班群里开口”。哪句像一张照片？',
  say:['第4页：场景是谁、什么时候、在哪、卡在哪。','愿望和方案，都不是场景。','第5页小测：这条描述缺了什么？默默想，老师逐条揭晓。'],
  doing:'小测，不点名。',next:'看懂了，下一站：自己写一个。'},
 {t:'写场景：PSPS',pg:'第6–9页',m:12,
  story:'小李学会了一个四格模板：人物、场景、痛点、方案。他先写了一个广告式的“场景”，被同学指出：方案写进场景了。他把产品拿掉，补上时间地点和卡住的那一步。',
  say:['第6页：PSPS四格各问一个问题。','第7页：小李的一个中午，看好在哪。','第8页：守住三条：只写已经在做的事、痛点具体到一步、一个场景一个痛点。','第9页：改一改，把广告改回场景。'],
  doing:'看，心里对照；不点名。',next:'四格会了，轮到你们自己写。'},
 {t:'课堂练习：写第一个场景',pg:'第10–11页',m:15,
  story:'轮到学生自己。每人用场景四格小教练，写画像人物的一个场景，写完让AI按四条标准核查，只改“要改”的那一条。',
  say:['第10页：照句式写，约10分钟；手机扫码或电脑打开小教练。','写的时候页面会提醒：缺时间地点、场景里出现产品、痛点太笼统。','第11页：复制给AI核查，AI只检查不替你写。','打不开：直接写在备忘录里，一样。','不点名，不展示，不交。'],
  doing:'写出一个场景，让AI核查，改一条。',next:'写好一个了。下一站：场景从哪来。'},
 {t:'场景从哪来：情境访查',pg:'第12–13页',m:6,
  story:'小李站在教学楼下看了6分钟：打开班群又退出，一个人走向食堂。他问同学：为什么没发？答：怕没人回，显得尴尬。看到的是行为，问出来的是原因，合起来才是一个具体的痛点。',
  say:['第12页：四个步骤、四条准则；这次只了解，不要求做。','第13页：从“看”到“痛点”的小例子。'],
  doing:'听，心里想想自己有没有注意过身边人的卡点。',next:'看真实的人之后，再看他的一整天。'},
 {t:'看一天：生活中的一天',pg:'第14–19页',m:25.5,
  story:'小李把画像人物的一整天排开：几点，在哪，在做什么，需求在哪一刻冒出来。同一个人，时间在变，地点在变，新需求也跟着冒出来。',

const $=s=>document.querySelector(s), NS='http://www.w3.org/2000/svg';
const svg=$('#svg'),bubble=$('#bubble'),card=$('#card'),over=$('#over');
let key='ch5',cur=0,timer=null,anim=null,pathEl,visEl,heroEl,lens=[],pts=[],total=0;
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
function catmull(P){let d=`M${P[0][0]},${P[0][1]}`;for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2,k=.22;d+=` C${p1[0]+(p2[0]-p0[0])*k},${p1[1]+(p2[1]-p0[1])*k} ${p2[0]-(p3[0]-p1[0])*k},${p2[1]-(p3[1]-p1[1])*k} ${p2[0]},${p2[1]}`}return d}
function scene(){
  svg.innerHTML='';
  const b=BOOKS[key],n=b.st.length;
  el('circle',{cx:500,cy:44,r:26,fill:'#F6C36B',opacity:.9});
  el('path',{d:'M0,250 C150,190 260,230 400,205 C560,175 700,235 1000,190 L1000,330 L0,330Z',fill:'var(--hill1)'});
  el('path',{d:'M0,290 C200,250 380,285 560,262 C760,238 880,282 1000,262 L1000,330 L0,330Z',fill:'var(--hill2)'});
  [[90,262],[330,276],[610,270],[820,282],[960,262]].forEach(([x,y])=>{el('rect',{x:x-3,y:y-6,width:6,height:16,fill:'var(--road)'});el('path',{d:`M${x-16},${y-4} L${x},${y-34} L${x+16},${y-4}Z`,fill:'var(--tree)'})});
  pts=[];for(let i=0;i<n;i++){const x=70+i*(860/(n-1)),y=(i%2?112:176);pts.push([x,y])}
  const d=catmull(pts);
  pathEl=el('path',{d,fill:'none',stroke:'var(--road)','stroke-width':16,'stroke-linecap':'round'});
  el('path',{d,fill:'none',stroke:'var(--card)','stroke-width':2,'stroke-dasharray':'2 14','stroke-linecap':'round',opacity:.8});
  total=pathEl.getTotalLength();
  lens=pts.map((_,i)=>{if(i===0)return 0;const t=document.createElementNS(NS,'path');t.setAttribute('d',catmull(pts.slice(0,i+1)));svg.appendChild(t);const L=t.getTotalLength();svg.removeChild(t);return L});
  visEl=el('path',{d,fill:'none',stroke:'var(--orange)','stroke-width':8,'stroke-linecap':'round','stroke-dasharray':`${total}`,'stroke-dashoffset':total});
  b.st.forEach((s,i)=>{
    const g=el('g',{class:'node',tabindex:0,role:'button','aria-label':`第${i+1}站 ${s.t}`});
    el('circle',{class:'ring',cx:pts[i][0],cy:pts[i][1],r:30},g);
    el('circle',{class:'base',cx:pts[i][0],cy:pts[i][1],r:27},g);
    const t=el('text',{class:'num',x:pts[i][0],y:pts[i][1]},g);t.textContent=i+1;
    const lb=el('text',{class:'lbl',x:pts[i][0],y:pts[i][1]+60},g);
    const short=s.t.split('：')[0];lb.textContent=short;
    g.addEventListener('click',()=>go(i));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(i)}});
  });
  heroEl=el('g',{});
  const h=el('g',{class:'bob'},heroEl);
  el('rect',{x:-13,y:-12,width:26,height:30,rx:9,fill:'var(--teal)'},h);
  el('rect',{x:-19,y:-8,width:9,height:20,rx:4,fill:'var(--orange)'},h);
  el('circle',{cx:0,cy:-26,r:15,fill:'#F2C9A5'},h);
  el('path',{d:'M-15,-28 Q-12,-46 3,-42 Q16,-40 15,-26 Q8,-34 -4,-33 Q-10,-32 -15,-28Z',fill:'#3A2E28'},h);
  el('circle',{cx:-5,cy:-25,r:2,fill:'#3A2E28'},h);el('circle',{cx:6,cy:-25,r:2,fill:'#3A2E28'},h);
  el('path',{d:'M-4,-18 Q0,-14 5,-18',stroke:'#3A2E28','stroke-width':2,fill:'none','stroke-linecap':'round'},h);
  el('rect',{x:-9,y:18,width:7,height:10,rx:3,fill:'#3A2E28'},h);el('rect',{x:2,y:18,width:7,height:10,rx:3,fill:'#3A2E28'},h);
  place(lens[cur]);
}
function place(L){const p=pathEl.getPointAtLength(L);heroEl.setAttribute('transform',`translate(${p.x},${p.y-62})`);visEl.setAttribute('stroke-dashoffset',total-L)}
function marks(){svg.querySelectorAll('.node').forEach((g,i)=>{g.classList.toggle('done',i<cur);g.classList.toggle('cur',i===cur)})}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function typeIn(text){
  bubble.innerHTML=`<b>${esc(BOOKS[key].hero)}：</b><span id="bt"></span>`;const bt=$('#bt');
  if(REDUCE){bt.textContent=text;return}
  let i=0;clearInterval(typeIn.t);typeIn.t=setInterval(()=>{bt.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typeIn.t)},32)}
function render(){
  const b=BOOKS[key],s=b.st[cur],n=b.st.length;
  marks();typeIn(s.story);
  const hasM=b.st.some(x=>x.m);

  <h2>${esc(s.t)}</h2>
  <div class="cols"><div class="col"><h3>这一站怎么讲</h3><ul>${s.say.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="col"><h3>学生做什么</h3><p>${esc(s.doing)}</p></div>
  <div class="col"><h3>走向下一站</h3><p>${esc(s.next)}</p></div></div>`;

  $('#pbar').style.width=((cur+1)/n*100)+'%';
  let acc=0;if(hasM)b.st.slice(0,cur+1).forEach(x=>acc+=x.m||0);
  $('#pmeta').textContent=hasM?`讲到这里约 ${acc} 分钟`:`第 ${cur+1} 站`;
  over.innerHTML=b.st.map((x,i)=>`<div class="row" role="button" tabindex="0" data-i="${i}" ${i===cur?'aria-current="true"':''}><span class="n">${i+1}</span><span class="t">${esc(x.t)}<small>${esc(x.pg)}</small></span><span class="m">${x.m?x.m+' 分钟':''}</span></div>`).join('');
  over.querySelectorAll('.row').forEach(r=>{r.onclick=()=>go(+r.dataset.i);r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(+r.dataset.i)}}});
  $('#foot').textContent=b.foot;
}
function go(i){
  const n=BOOKS[key].st.length;i=Math.max(0,Math.min(n-1,i));
  const from=cur===i&&anim?null:lens[cur];cur=i;marks();render();
  const to=lens[i];cancelAnimationFrame(anim);
  const st=$('#stage');
  if(REDUCE||from==null||from===to){place(to);return}
  st.classList.remove('still');const t0=performance.now(),D=Math.min(1600,500+Math.abs(to-from)*1.6);
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;place(from+(to-from)*e);
    if(k<1)anim=requestAnimationFrame(step);else{anim=null;st.classList.add('still')}};
  anim=requestAnimationFrame(step);
}
function stopPlay(){clearInterval(timer);timer=null;const p=$('#play');p.setAttribute('aria-pressed','false');p.textContent='自动讲故事'}
function startPlay(){const p=$('#play');p.setAttribute('aria-pressed','true');p.textContent='暂停';
  timer=setInterval(()=>{if(cur>=BOOKS[key].st.length-1){stopPlay();return}go(cur+1)},9000)}
$('#next').onclick=()=>{stopPlay();go(cur===BOOKS[key].st.length-1?0:cur+1)};
$('#prev').onclick=()=>{stopPlay();go(cur-1)};
$('#play').onclick=()=>timer?stopPlay():startPlay();
document.addEventListener('keydown',e=>{if(e.target.closest('.node,.row,button'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
function setBook(k){stopPlay();key=k;cur=0;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===k));
  scene();render()}
$('#tabs').innerHTML=Object.keys(BOOKS).sort().map(k=>`<button class="tab" role="tab" data-k="${k}" type="button">${BOOKS[k].tab}</button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setBook(t.dataset.k));
setBook('ch7a');
</script>
