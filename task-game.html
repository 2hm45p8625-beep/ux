<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>任务通关：小林的一天</title>
<style>
:root{--bg:#F3F6FF;--card:#FFFFFF;--line:#CFD9F5;--ink:#1F2A44;--muted:#5B6785;--teal:#2563EB;--teal2:#60A5FA;--pale:#E8EEFF;--orange:#EA580C;--peach:#FFF1E3;--ok:#15803D;--okbg:#DDF7E7;--bad:#D6336C;--badbg:#FFE3EC;--star:#F59E0B;--onteal:#FFFFFF;--pink:#E11D74;--purple:#7C3AED;
--font:"Microsoft YaHei","PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif;--mono:Consolas,Menlo,"Courier New",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:linear-gradient(#EAF1FF,#FFF4F8 70%,#FFF9E8);background-attachment:fixed;color:var(--ink);font-family:var(--font);line-height:1.55;font-size:19px;padding:10px max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left));user-select:none;min-height:100vh}
.wrap{max-width:780px;margin:0 auto}
body.hit .wrap{animation:shake .3s}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;min-height:38px}
.pips{display:flex;gap:5px;flex:1 1 220px}
.pip{flex:1;background:#fff;padding:4px 4px;font-size:13px;color:var(--muted);text-align:center;border:2px solid var(--line);border-radius:10px;white-space:nowrap;overflow:hidden;font-weight:700}
.pip.on{color:#fff;background:var(--teal);border-color:#1D4ED8;box-shadow:0 3px 0 #1D4ED8}
.pip.done{background:var(--okbg);border-color:#86D9A8;color:var(--ok)}
.hud{display:flex;gap:8px;align-items:center;font-weight:800}
.hp{display:none}
.miss-chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:14px;color:var(--muted)}
.score{color:var(--orange);font-family:var(--mono);font-size:21px}
.combo{background:var(--pink);color:#fff;padding:1px 12px;border-radius:999px;font-size:14px;font-family:var(--mono);box-shadow:0 3px 0 #9D174D}
.ib{border:2px solid var(--line);background:#fff;border-radius:10px;width:auto;min-width:36px;padding:0 8px;height:34px;font-weight:800;color:var(--teal);font-size:14px}
.card{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 4px 0 var(--line)}
.say{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.say svg{flex:none;width:72px;height:72px}
.bubble{position:relative;background:#fff;border:3px solid var(--teal2);border-radius:16px;padding:8px 12px;flex:1;font-size:18px}
.bubble:before{content:"";position:absolute;left:-12px;top:20px;border:8px solid transparent;border-right:10px solid var(--teal2);border-left:0}
.bubble b{color:var(--pink)}
h1{font-size:clamp(32px,7vw,46px);margin:2px 0;color:var(--teal);letter-spacing:2px}
h2{font-size:22px;margin:0 0 6px;color:var(--teal)}
.sub{color:var(--muted);font-size:15px}
.btn{display:block;width:100%;min-height:56px;border:0;border-bottom:5px solid #1E40AF;border-radius:16px;background:var(--teal);color:#fff;font-weight:800;font-size:21px;padding:8px 16px;margin-top:10px}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.ghost{background:#fff;color:var(--teal);border:3px solid var(--teal);border-bottom-width:5px}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;min-height:48px;border:3px solid var(--line);border-radius:12px;background:#fff;font-weight:700}
.seg button.on{border-color:var(--teal);background:var(--pale);color:var(--teal)}
.stg{margin:2px 0 8px;padding:6px 4px;border-left:8px solid var(--pink)}
.stg small{display:block;font-family:var(--mono);letter-spacing:3px;color:var(--pink);font-size:14px;font-weight:700}
.stg b{font-size:28px;color:var(--ink)}
.how{border-color:var(--star)}
.stage{position:relative;overflow:hidden;border:3px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--line)}
.lvtitle{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 6px}
.lvtitle b{color:var(--teal);font-size:21px}
.prog{height:12px;background:#fff;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin:0 2px 8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#22C55E,#16A34A);width:0;transition:width .25s}
.msg{min-height:30px;font-size:17px;margin:6px 2px;color:var(--muted)}
.msg.ok{color:var(--ok);font-weight:700} .msg.no{color:var(--bad);font-weight:700}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-weight:900;font-size:26px;color:var(--ok);z-index:40;animation:up .9s forwards;font-family:var(--mono);-webkit-text-stroke:1px #fff}
.fx.bd{color:var(--bad)}
.bigfx{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:41;pointer-events:none;font-size:clamp(34px,9vw,60px);font-weight:900;font-style:italic;color:var(--pink);font-family:var(--mono);-webkit-text-stroke:2px #fff;text-shadow:0 4px 0 #9D174D;animation:big 1s forwards;white-space:nowrap}
@keyframes big{0%{transform:translateX(-50%) scale(.4);opacity:0}20%{transform:translateX(-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateX(-50%) translateY(-40px) scale(1);opacity:0}}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}
/* 第1关 */
.belt{height:150px;background:repeating-linear-gradient(90deg,#DCE6FF 0 24px,#EEF3FF 24px 48px);border-bottom:10px solid #94A3B8;position:relative;animation:beltm 1.4s linear infinite}
@keyframes beltm{to{background-position:-48px 0}}
.bcard{position:absolute;top:16px;height:104px;background:#fff;border:3px solid var(--teal);border-radius:14px;padding:8px 10px;font-weight:800;font-size:19px;line-height:1.3;display:flex;align-items:center;box-shadow:0 4px 0 #93B4F5;will-change:transform;color:var(--ink)}
.bcard.inc{border-color:var(--orange);background:var(--peach);box-shadow:0 4px 0 #F6B98A}
.bcard.front{outline:5px solid var(--star);outline-offset:2px}
.bcard.fly{transition:transform .35s,opacity .35s;opacity:0;transform:translateY(120px) scale(.5)!important}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.bin{--c:var(--teal);min-height:62px;border:3px solid var(--c);border-bottom-width:6px;border-radius:14px;background:#fff;font-weight:800;font-size:19px;color:var(--c);line-height:1.2;padding:4px}
.bin small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.bin:active{transform:translateY(3px);border-bottom-width:3px}
@media(max-width:520px){.bcard{font-size:17px}}
/* 三消 */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 8px}
.lg{--c:var(--teal);border:2px solid var(--c);color:var(--c);padding:1px 10px;font-size:14px;font-weight:800;border-radius:10px;background:#fff}
.lg small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.lg.done{background:var(--c);color:#fff}.lg.done small{color:#fff}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:2px}
@media(max-width:520px){.board{grid-template-columns:repeat(3,1fr)}}
.tile{min-height:96px;border:3px solid #B6C6F0;border-bottom-width:6px;border-radius:14px;background:#fff;color:var(--ink);font-weight:700;font-size:17px;line-height:1.35;padding:6px 8px}
.tile:active{transform:translateY(2px)}
.tile.on{border-color:var(--star);background:#FFF6D6;transform:translateY(-3px);box-shadow:0 0 0 3px #FDE68A}
.tile.hint{animation:hn .7s infinite;border-color:var(--purple)}
@keyframes hn{50%{background:#EDE4FF}}
.tile.boom{animation:boom .38s forwards}
@keyframes boom{to{transform:scale(1.5);opacity:0}}
/* 第4关 */
.steps{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:520px){.steps{grid-template-columns:1fr}}
.stp{min-height:64px;text-align:left;border:3px solid #B6C6F0;border-bottom-width:6px;border-radius:14px;background:#fff;padding:6px 12px;font-weight:800;color:var(--ink)}
.stp small{display:block;font-weight:500;color:var(--muted);font-size:14px;line-height:1.3}
.stp.used{opacity:.25}
.slotbar{display:flex;gap:4px;margin:6px 0}
.slotbar i{flex:1;height:38px;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:var(--muted);font-family:var(--mono)}
.slotbar i.f{border-style:solid;color:#fff;animation:pop .25s}
.slotbar i.f.a{background:var(--teal);border-color:var(--teal)} .slotbar i.f.b{background:var(--pink);border-color:var(--pink)}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.faces button{min-height:84px;border:3px solid var(--line);border-bottom-width:6px;border-radius:14px;background:#fff;font-weight:800;font-size:19px}
.faces svg{width:42px;height:42px;display:block;margin:0 auto 2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;text-align:left}
.cmp div{padding:8px 12px;background:var(--pale);border-radius:12px}
.cmp b{display:block;font-size:14px;color:var(--teal)}
.ride{width:100%;height:auto;display:block;background:#fff;border:2px solid var(--line);border-radius:14px}
.brake{min-height:80px;font-size:26px;background:var(--bad);border-bottom-color:#9D174D;animation:pls 1.2s infinite}
@keyframes pls{50%{transform:scale(1.02)}}
.rank{font-family:var(--mono);font-weight:900;font-size:86px;line-height:1;color:var(--star);text-shadow:0 5px 0 #B45309;animation:pop .5s}
.rank.A{color:#22C55E;text-shadow:0 5px 0 #166534} .rank.B{color:#60A5FA;text-shadow:0 5px 0 #1D4ED8}
.mini{font-family:var(--mono);font-weight:900;font-size:32px;color:var(--star);letter-spacing:6px}
.center{text-align:center}
.take li{margin:6px 0}
.miss{border-left:6px solid var(--pink);padding:4px 12px;margin:8px 0;background:var(--badbg);border-radius:8px;font-size:17px}
.modal{position:fixed;inset:0;background:rgba(31,42,68,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal .card{max-width:520px;width:100%;margin:0}
.cd{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(243,246,255,.95)}
.cd b{font-family:var(--mono);font-size:clamp(60px,18vw,130px);font-style:italic;color:var(--teal);letter-spacing:6px;text-shadow:0 6px 0 #1E40AF;animation:zoom .6s}
@keyframes zoom{from{transform:scale(2.4);opacity:0}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
svg text{font-family:var(--font)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:45}
.blink{animation:blink 4s infinite;transform-origin:40px 42px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.blink,.belt,.brake{animation:none}}
</style></head><body>
<div class="wrap"><div id="hd"></div><div id="main"></div></div>
<canvas id="cf"></canvas>
<script>
"use strict";
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const main=$('#main'),hd=$('#hd');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S,cur=null,SND=false;
const PR=[{t:'简化任务结构',s:'步骤越少，越不容易出错'},{t:'利用限制因素',s:'设个障碍，只能用对办法'},{t:'考虑易出错性',s:'要提醒，也要能挽回'},{t:'标准化',s:'大家都这样，学一次到处通用'}];
const FOUR=[{t:'动机和目的',s:'他为什么要做'},{t:'行动计划',s:'打算怎么做'},{t:'具体操作',s:'做的时候遇到什么、怎么办'},{t:'任务评估',s:'做完以后觉得怎样'}];
function reset(keepMode){const m=S?S.easy:false;S={lv:0,score:0,combo:0,max:0,hearts:3,mist:[0,0,0,0],missed:[],easy:keepMode?m:false,assist:false,badges:[],run:0,doneRun:-1}}
const K=()=>(S.easy?.7:1)*(S.assist?.8:1);
function mascot(mood){const m={happy:'M26 54 Q40 66 54 54',sad:'M28 60 Q40 52 52 60',neutral:'M30 58 L50 58',wow:'M34 54 Q40 66 46 54 Q40 52 34 54'}[mood||'neutral'];
 return `<svg viewBox="0 0 80 80" aria-hidden="true"><line x1="40" y1="8" x2="40" y2="18" stroke="#2563EB" stroke-width="3"/><circle cx="40" cy="7" r="5" fill="#E11D74"/><rect x="10" y="18" width="60" height="54" rx="14" fill="#60A5FA" stroke="#2563EB" stroke-width="3"/><rect x="17" y="27" width="46" height="37" rx="9" fill="#fff"/><g class="blink"><circle cx="30" cy="42" r="6" fill="#1F2A44"/><circle cx="50" cy="42" r="6" fill="#1F2A44"/><circle cx="32" cy="40" r="2" fill="#fff"/><circle cx="52" cy="40" r="2" fill="#fff"/></g><path d="${m}" fill="none" stroke="#1F2A44" stroke-width="3" stroke-linecap="round"/></svg>`}
function lin(mood){const m={happy:'M30 52 Q40 62 50 52',sad:'M30 58 Q40 50 50 58',neutral:'M32 55 L48 55',angry:'M30 58 Q40 50 50 58'}[mood||'neutral'];
 return `<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="42" r="28" fill="#F6D2B0"/><path d="M12 38 Q14 10 40 10 Q66 10 68 38 Q56 24 40 26 Q24 24 12 38Z" fill="#3B2F2A"/><circle cx="30" cy="44" r="3.5" fill="#3B2F2A"/><circle cx="50" cy="44" r="3.5" fill="#3B2F2A"/>${mood==='angry'?'<path d="M24 36 L34 40 M56 36 L46 40" stroke="#3B2F2A" stroke-width="3"/>':''}<path d="${m}" fill="none" stroke="#3B2F2A" stroke-width="3" stroke-linecap="round"/></svg>`}
function monster(){return `<svg viewBox="0 0 40 40"><path d="M6 30 Q4 8 20 8 Q36 8 34 30 L30 26 L25 32 L20 26 L15 32 L10 26Z" fill="#E11D74"/><circle cx="14" cy="20" r="4" fill="#fff"/><circle cx="26" cy="20" r="4" fill="#fff"/><circle cx="15" cy="21" r="2" fill="#222"/><circle cx="25" cy="21" r="2" fill="#222"/><path d="M9 13 L17 17 M31 13 L23 17" stroke="#7a1f16" stroke-width="3"/></svg>`}
function face(v){const c=v>0?'#15803D':v<0?'#D6336C':'#6B7280',m=v>0?'M12 24 Q20 32 28 24':v<0?'M12 30 Q20 22 28 30':'M13 27 L27 27';return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="${c}" stroke-width="3"/><circle cx="14" cy="16" r="2.5" fill="${c}"/><circle cx="26" cy="16" r="2.5" fill="${c}"/><path d="${m}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`}
function say(html,mood){return `<div class="say" id="say">${mascot(mood)}<div class="bubble">${html}</div></div>`}
function bub(html,mood){const s=$('#say');if(s)s.innerHTML=mascot(mood||'neutral')+`<div class="bubble">${html}</div>`}
/* 音效（默认关闭） */
let AC=null;function beep(f,d,t,v){if(!SND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function sfx(k){if(k==='ok'){beep(660,.12);setTimeout(()=>beep(880,.15),90)}else if(k==='no')beep(150,.25,'sawtooth',.06);else if(k==='win'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*110))}}
function fxText(el,txt,bad){const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='fx'+(bad?' bd':'');d.textContent=txt;d.style.left=(r.left+r.width/2-20)+'px';d.style.top=(r.top+r.height/2-12)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
function header(){
 hd.innerHTML=`<div class="pips">${['拆任务','四部分','设计原则','旅程图'].map((n,i)=>`<div class="pip ${S.badges[i]?'done':''} ${i===S.lv&&!S.done?'on':''}" data-l="${i}" style="cursor:pointer">${i+1} ${n}</div>`).join('')}</div>
 <div class="hud"><span class="miss-chip">失误 ${S.mist[Math.min(S.lv,3)]||0}</span><span class="score" id="sc">${String(S.score).padStart(4,'0')}</span>${S.combo>=2?`<span class="combo bump">COMBO ×${S.combo}</span>`:''}<button class="ib" id="snd" title="音效" style="width:auto;padding:0 8px;font-size:13px">${SND?'声音开':'声音关'}</button><button class="ib" id="hp" title="速记卡">?</button></div>`;
 hd.querySelectorAll('.pip').forEach(p=>p.onclick=()=>{cur=null;menu()});$('#snd').onclick=()=>{SND=!SND;header();if(SND)sfx('ok')};$('#hp').onclick=cheat}
const CHEAT=[
 '<b>任务像一棵倒着长的树</b>：大任务拆成小任务（点外卖：选店、选菜、下单、付款、等餐）。意外情况要写成<b>“如果……就……”</b>，任务树才完整。',
 '<b>做成一件事有四个部分</b>：<br>动机和目的：为什么做<br>行动计划：打算怎么做<br>具体操作：做的时候遇到什么、怎么办<br>任务评估：做完以后觉得怎样（最容易被忘）',
 '<b>四条设计原则</b>：<br>简化任务结构：步骤越少越不容易出错<br>利用限制因素：设个障碍，只能用对办法<br>考虑易出错性：要提醒，也要能挽回<br>标准化：大家都这样，学一次到处通用',
 '<b>旅程图八步</b>：前四步摆事实（特征、阶段、行为、触点），后四步找问题（预期、实际体验、情绪、寻找机会）。<br>低于预期是负面，符合是一般，超出是满意。<b>只改情绪最低的那一个</b>。'];
function cheat(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><h2>速记卡 · 第${Math.min(S.lv,3)+1}关</h2><p>${CHEAT[Math.min(S.lv,3)]}</p><button class="btn" id="cl">知道了，继续</button></div>`;document.body.appendChild(m);m.querySelector('#cl').onclick=()=>m.remove()}
/* 得分 / 失分 */
function big(t){const d=document.createElement('div');d.className='bigfx';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function good(el,pts){S.combo++;S.max=Math.max(S.max,S.combo);const p=(pts||10)+Math.min(S.combo-1,5)*2;S.score+=p;header();if(el)fxText(el,'+'+p);if(S.combo>=3)big('COMBO ×'+S.combo);sfx('ok')}
function rec(id,q,a,why){if(!S.missed.find(m=>m.id===id))S.missed.push({id,q,a,why,lv:S.lv})}
function bad(el,id,q,a,why,noheart){S.combo=0;S.mist[S.lv]++;rec(id,q,a,why);header();if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');fxText(el,'差一点',1)}document.body.classList.add('hit');setTimeout(()=>document.body.classList.remove('hit'),320);sfx('no');}
function setMsg(t,k){const m=$('#msg');if(m){m.className='msg '+(k||'');m.innerHTML=t}}
function gameOver(){cur=null;const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card center"><div style="width:90px;margin:auto">${mascot('sad')}</div><h2 style="font-family:var(--mono);color:var(--bad);font-size:34px;">这一关没过</h2><p>5次机会用完了。再来一次，这次速度会放慢一点。</p><button class="btn" id="re">再来一次</button></div>`;document.body.appendChild(m);
 m.querySelector('#re').onclick=()=>{m.remove();S.assist=true;S.hearts=3;S.mist[S.lv]=0;S.missed=S.missed.filter(x=>x.lv!==S.lv);S.combo=0;startLevel(S.lv)}}

 let k=0;const done=[];

 <div class="card center"><div class="sub" style="font-family:var(--mono);letter-spacing:3px">${ST.map((x,i)=>i<k?'●':i===k?'◉':'○').join(' ')}</div><div style="font-size:26px;font-weight:900;color:var(--star)">${q[0]}</div><div class="cmp"><div><b>他预期</b>${q[1]}</div><div><b>实际</b>${q[2]}</div></div><div class="faces">${[1,0,-1].map(v=>`<button data-v="${v}">${face(v)}${v>0?'满意':v<0?'负面':'一般'}</button>`).join('')}</div><div class="msg" id="msg"></div></div>`;
  document.querySelectorAll('.faces button').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;if(v===q[3]){good(b,8);setMsg(q[4],'ok');document.querySelectorAll('.faces button').forEach(x=>x.disabled=true);setTimeout(()=>{k++;if(k<5)one();else part4C(ST.map(x=>[x[0],x[5]]))},750)}
   else{bad(b,'4B-'+k,'点外卖“'+q[0]+'”：预期“'+q[1]+'”，实际“'+q[2]+'”。情绪是？',q[3]>0?'满意':q[3]<0?'负面':'一般',q[4]);setMsg('比一比“预期”和“实际”。','no')}})}
 one();cur={kind:'L4B',ans(){return ST[k]?ST[k][3]:null},tick(){}}}
function part4C(pts){
 const R0={n:'点外卖',pts:pts,a:2,why:'等了一个多小时、不知道骑手到哪：这就是机会点。还记得任务树里的“看骑手位置”吗？'};
 let p=0,state='ride';const D=()=>7/K();
 const X=i=>60+i*130,Y=v=>120-v*45;const d=R0.pts.map((q,i)=>`${i?'L':'M'}${X(i)} ${Y(q[1])}`).join(' ');
 main.innerHTML=`<div class="lvtitle"><b>③ 点外卖的情绪过山车</b><span class="sub"></span></div><div class="card"><div class="sub">这是你刚刚判出来的曲线。过山车经过情绪最低的那一站时，按“在这儿改！”</div>
 <svg class="ride" viewBox="0 0 640 300" id="rs"><line x1="20" x2="620" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="5 5"/><path id="trk" d="${d}" fill="none" stroke="var(--teal)" stroke-width="5" stroke-linejoin="round"/>
 ${R0.pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q[1])}" r="9" fill="var(--card)" stroke="${q[1]<0?'var(--bad)':'var(--teal)'}" stroke-width="4"/><text x="${X(i)}" y="285" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">${q[0]}</text>`).join('')}
 <g id="cart"><rect x="-17" y="-24" width="34" height="22" rx="6" fill="var(--star)"/><circle cx="-8" cy="-2" r="5" fill="#222"/><circle cx="8" cy="-2" r="5" fill="#222"/><circle cx="0" cy="-14" r="6" fill="#F6D2B0"/></g></svg>
 <div class="msg" id="msg"></div><button class="btn brake" id="bk">在这儿改！</button></div>`;
 const trk=$('#trk'),len=trk.getTotalLength(),cart=$('#cart');
 function place(){const pt=trk.getPointAtLength(len*p);cart.setAttribute('transform',`translate(${pt.x},${pt.y})`)}place();
 $('#bk').onclick=()=>{if(state!=='ride')return;const lowP=R0.a/(R0.pts.length-1);
  if(Math.abs(p-lowP)<.13){state='hit';good($('#bk'),20);setMsg(R0.why,'ok');setTimeout(levelDone,1800)}
  else{state='miss';bad($('#bk'),'4C','过山车：情绪最低的一站在哪？',R0.pts[R0.a][0],R0.why,false);setMsg('这儿不是最低点。哪一站最低？','no');if(S.hearts>0)setTimeout(()=>{p=0;state='ride';setMsg('','')},900)}};
 cur={kind:'L4C',tick(dt){if(S.hearts<=0)return;if(state==='ride'){p+=dt/D();if(p>=1)p=0;place()}}}}
home();
</script></body></html>
