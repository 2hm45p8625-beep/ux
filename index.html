<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>练一练：给“删除动态”打个分</title>
<style>
:root{--bg:#fffaf0;--ink:#2d3b3a;--teal:#1f6f68;--teal-l:#e3efec;--orange:#cc6228;--card:#fff;--line:#e8dfcc;--red:#d9503f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px;color:var(--teal)}
.sub{color:#5d6b69;margin:0 0 14px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.step{font-weight:700;color:var(--teal);margin:0 0 8px}
.phone{width:280px;margin:0 auto;background:#26364f;border-radius:34px;padding:10px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.screen{position:relative;height:500px;background:#f0f0ef;border-radius:26px;overflow:hidden;padding:36px 12px 12px}
.notch{position:absolute;top:10px;left:50%;width:70px;height:8px;margin-left:-35px;background:#d3d3d0;border-radius:4px}
.post{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;position:relative;transition:.3s}
.post.gone{display:none}
.head{display:flex;align-items:center;gap:8px}
.av{width:28px;height:28px;border-radius:50%}
.nm{font-weight:700;font-size:14px;line-height:1.2}
.tm{font-size:11px;color:#8a8a86}
.more{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:#777;cursor:pointer;padding:2px 8px;border-radius:8px}
.more.hint{animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:#ffe3d3}}
.txt{font-size:14px;margin:8px 0}
.pics{display:flex;gap:6px}.pics i{flex:1;height:44px;border-radius:6px}
.menu{position:absolute;right:10px;top:44px;background:#2d3b3a;border-radius:10px;padding:6px;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.menu button{display:block;background:var(--red);color:#fff;border:0;border-radius:6px;padding:8px 22px;font-size:14px;cursor:pointer}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:8}
.dlg{background:#fff;border-radius:14px;padding:16px;width:210px;text-align:center}
.dlg b{display:block;margin-bottom:4px}.dlg p{margin:0 0 12px;font-size:13px;color:#666}
.dlg button{border:0;border-radius:18px;padding:7px 18px;font-size:14px;cursor:pointer;margin:0 3px}
.b-c{background:#e6ebea;color:#333}.b-d{background:var(--red);color:#fff}
.toast{position:absolute;left:12px;right:12px;bottom:14px;background:#2d3b3a;color:#fff;border-radius:22px;padding:9px 14px;display:none;align-items:center;justify-content:space-between;z-index:9;overflow:hidden;font-size:14px}
.toast button{background:none;border:0;color:#ff9f6b;font-weight:700;font-size:14px;cursor:pointer}
.toast .bar{position:absolute;left:0;bottom:0;height:3px;background:#ff9f6b;width:100%}
.empty{display:none;text-align:center;color:#999;margin-top:60px;font-size:14px}
.tip{margin:12px auto 0;max-width:280px;font-size:14px;color:#5d6b69;text-align:center}
.reset{display:block;margin:10px auto 0;background:none;border:1px solid var(--teal);color:var(--teal);border-radius:18px;padding:5px 16px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tag{display:inline-block;color:#fff;border-radius:8px;padding:1px 10px;font-weight:700;margin-right:8px}
.q{font-weight:600}
.opts{display:flex;gap:8px;margin-top:8px}
.opts button{flex:1;padding:8px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;cursor:pointer;color:var(--ink)}
.opts button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.ref{display:none;margin-top:8px;background:var(--teal-l);border-radius:10px;padding:8px 10px;font-size:14px}
.done{display:none;background:var(--teal-l);border-radius:14px;padding:14px;margin-top:6px}
.done h3{margin:0 0 6px;color:var(--teal)}
.lock{color:#8a8a86;font-size:14px;margin:0 0 10px}
</style>
</head>
<body>
<div class="wrap">
<h1>练一练：给“删除动态”打个分</h1>
<p class="sub">① 左边的手机可以真的点：把第一条动态删掉　② 再在右边给五条原则各打个分。一个人完成，不需要提交，约 3 分钟。</p>
<div class="grid">
<div>
<p class="step" id="stepTitle">① 看到动态 → 点右上角“…”</p>
<div class="phone"><div class="screen" id="scr"><div class="notch"></div>
 <div class="post" id="p1">
  <div class="head"><div class="av" style="background:#5f9a8f"></div><div><div class="nm">小林</div><div class="tm">刚刚</div></div><button class="more hint" id="more" aria-label="更多">•••</button></div>
  <div class="txt">今天食堂的糖醋排骨太好吃了！</div>
  <div class="pics"><i style="background:#9fd5c8"></i><i style="background:#f4c9a0"></i><i style="background:#b4c6ee"></i></div>
  <div class="menu" id="menu" style="display:none"><button id="del">删除</button></div>
 </div>
 <div class="post"><div class="head"><div class="av" style="background:#d97b34"></div><div><div class="nm">阿杰</div><div class="tm">10 分钟前</div></div></div><div class="txt">图书馆占座成功，开卷！</div></div>
 <div class="empty" id="empty">这条动态已删除</div>
 <div class="mask" id="mask"><div class="dlg"><b>删除这条动态？</b><p>删除后，好友将看不到。</p><button class="b-c" id="no">取消</button><button class="b-d" id="yes">删除</button></div></div>
 <div class="toast" id="toast"><span>已删除</span><button id="undo">撤销</button><div class="bar" id="bar"></div></div>
</div></div>
<p class="tip" id="tip">轻点闪动的“•••”开始。</p>
<button class="reset" id="reset">重新体验一遍</button>
</div>
<div>
<p class="lock" id="lock">体验过后再打分，更准。也可以直接打分。</p>
<div id="cards"></div>
<div class="done" id="done"></div>
</div>
</div>
</div>
<script>
var P=[
["简单性","#5f9a8f","菜单里，只有必要的选项吗？","菜单里只有“删除”一项，没有多余选择，多数人会选“好”。不过一项也可能让人觉得“其他操作去哪了”，选“一般”也说得通。"],
["可见性","#cc6228","点了以后，有反馈吗？","点“…”弹出菜单，点“删除”弹出确认框，删完又有“已删除”提示：每一步都有反馈，多数人选“好”。"],
["可记忆性","#5f9a8f","下次还找得到这个入口吗？","“…”是很多软件通用的“更多”入口，位置固定在右上角，下次容易想起来。可以选“好”；如果你觉得“…”不够直观，选“一般”也有道理。"],
["可预测性","#cc6228","点之前，猜得到会发生什么吗？","菜单里写着“删除”，红色提示有风险，点之前大致猜得到。但“…”里还有什么、点了是直接删还是先确认，不点是不知道的，所以“好”或“一般”都说得通。"],
["安全性","#1f6f68","删错了，能撤销吗？","有确认框，删完还有“撤销”。但提示条几秒就消失，没来得及点就找不回来了。你觉得时间够吗？选“好”或“一般”都行，说出理由才重要。"]
];
var sel={},$=function(i){return document.getElementById(i)};
var cards=$("cards");
P.forEach(function(p,i){
 var d=document.createElement("div");d.className="card";
 d.innerHTML='<span class="tag" style="background:'+p[1]+'">'+p[0]+'</span><span class="q">'+p[2]+'</span><div class="opts"></div><div class="ref"></div>';
 var o=d.querySelector(".opts");
 ["好","一般","差"].forEach(function(t){var b=document.createElement("button");b.textContent=t;b.onclick=function(){
  sel[i]=t;[].forEach.call(o.children,function(x){x.classList.remove("on")});b.classList.add("on");
  var r=d.querySelector(".ref");r.style.display="block";r.textContent="参考看法：" +p[3];finish();};o.appendChild(b)});
 cards.appendChild(d)});
function finish(){
 if(Object.keys(sel).length<5)return;
 var n=0,low=[];P.forEach(function(p,i){if(sel[i]=="好")n++;else low.push(p[0])});
 var s="五条里你打了 "+n+" 个“好”。";
 s+= low.length?("打“一般”或“差”的是："+low.join("、")+"。这些地方就是改进的入口——想一想，改哪一个细节会让它更好？"):"全是“好”也别急着收工：想一想，撤销提示条的停留时间够不够？";
 s+="<br>没有标准分数：同一个界面，不同的人可以打不同的分，关键是说得出理由。";
 $("done").innerHTML="<h3>打完了</h3>"+s;$("done").style.display="block"}
var timer=null;
function stepTo(n,t,tip){$("stepTitle").textContent=t;$("tip").textContent=tip}
function resetAll(){
 clearTimeout(timer);
 $("p1").classList.remove("gone");$("empty").style.display="none";$("menu").style.display="none";
 $("mask").style.display="none";$("toast").style.display="none";$("more").classList.add("hint");
 stepTo(1,"① 看到动态 → 点右上角“…”","轻点闪动的“•••”开始。")}
$("more").onclick=function(){$("menu").style.display="block";$("more").classList.remove("hint");stepTo(2,"② 点“…”出菜单 → 点“删除”","菜单出来了，点红色的“删除”。")};
$("del").onclick=function(){$("menu").style.display="none";$("mask").style.display="flex";stepTo(3,"③ 点“删除”确认","弹出确认框，点“删除”确认，或“取消”退回。")};
$("no").onclick=function(){$("mask").style.display="none";$("more").classList.add("hint");stepTo(1,"① 看到动态 → 点右上角“…”","已取消，动态还在。")};
$("yes").onclick=function(){$("mask").style.display="none";$("p1").classList.add("gone");$("empty").style.display="block";
 var t=$("toast");t.style.display="flex";var b=$("bar");b.style.transition="none";b.style.width="100%";
 setTimeout(function(){b.style.transition="width 4s linear";b.style.width="0"},30);
 stepTo(4,"④ 删除后提示","删除后出现“已删除”提示，注意它停留多久。");
 clearTimeout(timer);timer=setTimeout(function(){t.style.display="none";$("tip").textContent="提示消失了。想再试一次，点“重新体验一遍”。"},4000)};
$("undo").onclick=function(){clearTimeout(timer);$("toast").style.display="none";$("p1").classList.remove("gone");$("empty").style.display="none";$("more").classList.add("hint");stepTo(1,"① 看到动态 → 点右上角“…”","已撤销，动态回来了。")};
$("reset").onclick=resetAll;
</script>
</body>
</html>
